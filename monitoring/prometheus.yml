global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "apishield-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "apishield-backend"
          environment: "production"

  - job_name: "apishield-backend-local"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000", "localhost:8000"]
        labels:
          service: "apishield-backend-local"
          environment: "development"
